name: Build Extension
description: Build the GitHub and store versions for Chrome and Firefox, lint the AMO build, and package everything.

outputs:
  version:
    description: Version from package.json
    value: ${{ steps.version.outputs.version }}
  chrome_zip:
    description: GitHub Chrome build (load unpacked)
    value: ${{ steps.package.outputs.chrome_zip }}
  firefox_xpi:
    description: GitHub Firefox build (self-updating via updates.json)
    value: ${{ steps.package.outputs.firefox_xpi }}
  cws_zip:
    description: Chrome Web Store upload
    value: ${{ steps.package.outputs.cws_zip }}
  amo_xpi:
    description: addons.mozilla.org upload
    value: ${{ steps.package.outputs.amo_xpi }}
  source_zip:
    description: Source code for AMO review
    value: ${{ steps.package.outputs.source_zip }}

runs:
  using: composite
  steps:
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Read version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Build extension
      shell: bash
      run: npm run build && npm run build:store

    - name: Lint the AMO build
      shell: bash
      run: npm run lint:amo

    - name: Package builds
      id: package
      shell: bash
      run: |
        BASE="betterseqta-plus-lite-${{ steps.version.outputs.version }}"
        (cd dist/chrome && zip -qr "../${BASE}-chrome.zip" .)
        (cd dist/firefox && zip -qr "../${BASE}.xpi" .)
        (cd dist/chrome-store && zip -qr "../${BASE}-cws.zip" .)
        (cd dist/firefox-store && zip -qr "../${BASE}-amo.xpi" .)
        git archive --format=zip -o "dist/${BASE}-source.zip" HEAD
        echo "chrome_zip=dist/${BASE}-chrome.zip" >> "$GITHUB_OUTPUT"
        echo "firefox_xpi=dist/${BASE}.xpi" >> "$GITHUB_OUTPUT"
        echo "cws_zip=dist/${BASE}-cws.zip" >> "$GITHUB_OUTPUT"
        echo "amo_xpi=dist/${BASE}-amo.xpi" >> "$GITHUB_OUTPUT"
        echo "source_zip=dist/${BASE}-source.zip" >> "$GITHUB_OUTPUT"
