name: Build Extension
description: Install dependencies, build the Chrome and Firefox extensions, and package them.

outputs:
  version:
    description: Version from package.json
    value: ${{ steps.version.outputs.version }}
  chrome_zip:
    description: Path to the Chrome extension zip
    value: ${{ steps.package.outputs.chrome_zip }}
  firefox_xpi:
    description: Path to the Firefox extension (.xpi)
    value: ${{ steps.package.outputs.firefox_xpi }}

runs:
  using: composite
  steps:
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install dependencies
      shell: bash
      run: npm install --legacy-peer-deps

    - name: Read version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Build extension
      shell: bash
      run: npm run build

    - name: Package builds
      id: package
      shell: bash
      run: |
        BASE="betterseqta-plus-lite-${{ steps.version.outputs.version }}"
        (cd dist/chrome && zip -qr "../${BASE}-chrome.zip" .)
        (cd dist/firefox && zip -qr "../${BASE}.xpi" .)
        echo "chrome_zip=dist/${BASE}-chrome.zip" >> "$GITHUB_OUTPUT"
        echo "firefox_xpi=dist/${BASE}.xpi" >> "$GITHUB_OUTPUT"
